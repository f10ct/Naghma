<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نغمة | Naghma - منصة تقييم الموسيقى</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #fff; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 pb-12">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-3xl font-black bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">نغمة</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAuthModal()" id="loginBtn" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-700 transition">
                    تسجيل الدخول
                </button>
                <button onclick="openAddModal()" class="bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-2 rounded-xl text-sm font-bold hover:opacity-90 transition">
                    + إضافة تقييم
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 pt-8">
        <header class="mb-10 text-right">
            <h1 class="text-3xl font-bold mb-2">أحدث الألبومات المقيّمة</h1>
            <p class="text-slate-400">شارِك آراءك واستكشف تقييمات المجتمع لأبرز الألبومات والأغاني.</p>
        </header>

        <!-- Albums Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="albumsGrid">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
                <div>
                    <div class="h-48 bg-slate-800 rounded-xl mb-4 flex items-center justify-center text-4xl shadow-inner">🎵</div>
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h2 class="text-xl font-bold">Mister Magic</h2>
                            <p class="text-sm text-slate-400">Grover Washington Jr.</p>
                        </div>
                        <span class="text-amber-400 font-bold text-sm">★ 4.8</span>
                    </div>
                    <p class="text-slate-300 text-sm mt-3 bg-slate-950/50 p-3 rounded-lg border border-slate-800/50">"ألبوم جاز وفانك أسطوري، الإيقاع ممتاز جداً."</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Auth (تسجيل الدخول بالإيميل) -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6">
            <h3 class="text-xl font-bold mb-2">تسجيل الدخول إلى نغمة</h3>
            <p class="text-xs text-slate-400 mb-4">أدخل إيميلك وسنرسل لك رمز/رابط الدخول المباشر.</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="userEmail" placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-gradient-to-r from-pink-600 to-purple-600 py-2.5 rounded-xl text-sm font-bold">إرسال الرمز</button>
                    <button onclick="closeAuthModal()" class="px-4 bg-slate-800 rounded-xl text-sm font-bold">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Review -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6">
            <h3 class="text-xl font-bold mb-4">إضافة تقييم جديد</h3>
            <div class="space-y-4">
                <input type="text" id="albumTitle" placeholder="اسم الألبوم" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                <input type="text" id="artistName" placeholder="الفنان" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
                <textarea id="albumReview" placeholder="انطباعك..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm h-24"></textarea>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeAddModal()" class="flex-1 bg-purple-600 py-2.5 rounded-xl text-sm font-bold">حفظ</button>
                    <button onclick="closeAddModal()" class="px-4 bg-slate-800 rounded-xl text-sm font-bold">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hajauilhnphamdmomhqn.supabase.co';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_ANON_هنا';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        async function handleLogin() {
            const email = document.getElementById('userEmail').value;
            if(!email) return alert('يرجى كتابة البريد الإلكتروني');
            
            const { error } = await supabaseClient.auth.signInWithOtp({ email: email });
            if (error) {
                alert('حدث خطأ: ' + error.message);
            } else {
                alert('تم إرسال رابط الدخول إلى إيميلك بنجاح! تفقد بريدك الإلكتروني.');
                closeAuthModal();
            }
        }
    </script>
</body>
</html>
