<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Naghma</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spotify: '#1DB954',
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#121212] text-white font-sans antialiased selection:bg-[#1DB954] selection:text-black min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_SONGS = [
            {
                id: "1",
                title: "Duvet",
                artist: "bôa",
                coverUrl: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60",
                rating: 5.0,
                addedBy: "System",
                reviews: [
                    { id: "r1", userName: "Faisal", userAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80", rating: 5.0, comment: "Absolute masterpiece. Timeless vibe!" }
                ]
            },
            {
                id: "2",
                title: "I Love You So",
                artist: "The Walters",
                coverUrl: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop&q=60",
                rating: 4.5,
                addedBy: "Mohsen",
                reviews: [
                    { id: "r2", userName: "Mohsen", userAvatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80", rating: 4.5, comment: "Guitar progression is immaculate." }
                ]
            }
        ];

        const MOCK_REGISTERED_USERS = [
            { id: "u1", name: "Alex Rover", email: "alex@music.com" },
            { id: "u2", name: "Sara Miller", email: "sara@music.com" },
            { id: "u3", name: "David Chen", email: "david@music.com" }
        ];

        function App() {
            const [songs, setSongs] = useState(() => {
                const saved = localStorage.getItem("mn_songs");
                return saved ? JSON.parse(saved) : INITIAL_SONGS;
            });

            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem("mn_user");
                return saved ? JSON.parse(saved) : null;
            });

            const [friends, setFriends] = useState(() => {
                const saved = localStorage.getItem("mn_friends");
                return saved ? JSON.parse(saved) : [];
            });

            const [drawerOpen, setDrawerOpen] = useState(false);
            const [addModalOpen, setAddModalOpen] = useState(false);
            const [selectedSong, setSelectedSong] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [friendSearch, setFriendSearch] = useState("");

            const [authEmail, setAuthEmail] = useState("");
            const [authName, setAuthName] = useState("");
            const [authPassword, setAuthPassword] = useState("");

            const [newTitle, setNewTitle] = useState("");
            const [newArtist, setNewArtist] = useState("");
            const [newCover, setNewCover] = useState("");
            const [newRating, setNewRating] = useState(5.0);
            const [newReview, setNewReview] = useState("");

            const [userRating, setUserRating] = useState(5.0);
            const [userReviewText, setUserReviewText] = useState("");

            useEffect(() => {
                localStorage.setItem("mn_songs", JSON.stringify(songs));
            }, [songs]);

            useEffect(() => {
                if (user) localStorage.setItem("mn_user", JSON.stringify(user));
                else localStorage.removeItem("mn_user");
            }, [user]);

            useEffect(() => {
                localStorage.setItem("mn_friends", JSON.stringify(friends));
            }, [friends]);

            useEffect(() => {
                lucide.createIcons();
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (!authEmail || !authPassword) return;
                const name = authName || authEmail.split("@")[0];
                setUser({ email: authEmail, name: name, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}` });
                setAuthEmail(""); setAuthName(""); setAuthPassword("");
            };

            const handleAddSong = (e) => {
                e.preventDefault();
                if (!newTitle || !newArtist) return;
                const newSongObj = {
                    id: Date.now().toString(),
                    title: newTitle,
                    artist: newArtist,
                    coverUrl: newCover || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60",
                    rating: newRating,
                    addedBy: user ? user.name : "Anonymous",
                    reviews: newReview ? [{
                        id: Date.now().toString(),
                        userName: user ? user.name : "Anonymous",
                        userAvatar: user ? user.avatar : "https://api.dicebear.com/7.x/avataaars/svg?seed=Anon",
                        rating: newRating,
                        comment: newReview
                    }] : []
                };
                setSongs([newSongObj, ...songs]);
                setAddModalOpen(false);
                setNewTitle(""); setNewArtist(""); setNewCover(""); setNewRating(5.0); setNewReview("");
            };

            const renderGuitars = (rating, interactive = false, onSelect = null) => {
                return (
                    <div className="flex items-center space-x-1">
                        {[1, 2, 3, 4, 5].map((idx) => {
                            const filled = rating >= idx;
                            return (
                                <button
                                    type="button"
                                    key={idx}
                                    disabled={!interactive}
                                    onClick={() => interactive && onSelect && onSelect(idx)}
                                    className={`${interactive ? "cursor-pointer hover:scale-110" : ""} transition-transform p-0.5`}
                                >
                                    <svg className={`w-5 h-5 ${filled ? "text-[#1DB954] fill-[#1DB954]" : "text-zinc-600"}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 5 4 4"/><path d="M13 7 8.7 11.3c-.4.4-.4 1 0 1.4l2.6 2.6c.4.4 1 .4 1.4 0L17 11"/><path d="m3 21 9-9"/><path d="M12.5 16.5l3.9 3.9a2 2 0 0 0 2.8 0l1.8-1.8a2 2 0 0 0 0-2.8l-3.9-3.9"/></svg>
                                </button>
                            );
                        })}
                        <span className="ml-2 text-xs font-semibold text-zinc-400">{rating.toFixed(1)}</span>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#121212] text-white">
                    {/* Header */}
                    <header className="sticky top-0 z-30 bg-[#121212]/95 backdrop-blur-md border-b border-zinc-800 px-4 md:px-8 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-full bg-[#1DB954] flex items-center justify-center text-black">
                                    <i data-lucide="guitar" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white">Music Naghma</h1>
                                    <p className="text-xs text-zinc-400">Rate & Track Music</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <input
                                    type="text"
                                    placeholder="Search music..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="hidden sm:block w-64 px-4 py-2 bg-zinc-900 border border-zinc-700/60 rounded-full text-sm text-white focus:outline-none focus:border-[#1DB954]"
                                />
                                <button
                                    onClick={() => setAddModalOpen(true)}
                                    className="flex items-center space-x-1.5 bg-[#1DB954] hover:bg-[#1ed760] text-black font-semibold px-4 py-2 rounded-full text-sm transition-all"
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span>Add Song</span>
                                </button>
                                <button
                                    onClick={() => setDrawerOpen(true)}
                                    className="p-2 bg-zinc-900 border border-zinc-800 rounded-full text-zinc-300 hover:text-white"
                                >
                                    <i data-lucide="menu" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 md:px-8 py-8">
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                            {songs.filter(s => s.title.toLowerCase().includes(searchQuery.toLowerCase()) || s.artist.toLowerCase().includes(searchQuery.toLowerCase())).map((song) => (
                                <div
                                    key={song.id}
                                    onClick={() => setSelectedSong(song)}
                                    className="group bg-zinc-900/60 border border-zinc-800 rounded-xl overflow-hidden hover:border-[#1DB954]/50 transition-all cursor-pointer flex flex-col"
                                >
                                    <div className="relative aspect-square overflow-hidden bg-zinc-800">
                                        <img src={song.coverUrl} alt={song.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                        <div className="absolute top-2 right-2 bg-black/80 px-2 py-1 rounded-md border border-white/10 flex items-center space-x-1">
                                            <span className="text-xs font-bold text-[#1DB954]">★ {song.rating.toFixed(1)}</span>
                                        </div>
                                    </div>
                                    <div className="p-3">
                                        <h3 className="font-bold text-sm text-white truncate">{song.title}</h3>
                                        <p className="text-xs text-zinc-400 truncate">{song.artist}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Drawer */}
                    {drawerOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="fixed inset-0 bg-black/70" onClick={() => setDrawerOpen(false)} />
                            <div className="relative w-full max-w-md bg-[#181818] border-l border-zinc-800 h-full p-6 flex flex-col overflow-y-auto z-10">
                                <div className="flex items-center justify-between border-b border-zinc-800 pb-4 mb-6">
                                    <h2 className="font-bold text-lg text-white">User & Friends</h2>
                                    <button onClick={() => setDrawerOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                {!user ? (
                                    <form onSubmit={handleLogin} className="space-y-3 bg-zinc-900 p-4 rounded-xl mb-6">
                                        <h3 className="text-sm font-bold text-white mb-2">Login / Register</h3>
                                        <input type="text" placeholder="Name" value={authName} onChange={(e) => setAuthName(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white" />
                                        <input type="email" placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white" required />
                                        <input type="password" placeholder="Password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-xs text-white" required />
                                        <button type="submit" className="w-full bg-[#1DB954] text-black font-semibold text-xs py-2.5 rounded-lg">Save & Enter</button>
                                    </form>
                                ) : (
                                    <div className="bg-zinc-900 p-4 rounded-xl mb-6 flex items-center justify-between">
                                        <div>
                                            <h3 className="text-sm font-bold text-white">{user.name}</h3>
                                            <p className="text-xs text-zinc-400">{user.email}</p>
                                        </div>
                                        <button onClick={() => setUser(null)} className="text-red-400 text-xs">Logout</button>
                                    </div>
                                )}

                                <div className="space-y-4">
                                    <h3 className="text-sm font-bold text-zinc-300">Add Friends</h3>
                                    <input type="text" placeholder="Search user..." value={friendSearch} onChange={(e) => setFriendSearch(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white" />
                                    {MOCK_REGISTERED_USERS.filter(u => friendSearch && u.name.toLowerCase().includes(friendSearch.toLowerCase())).map(cand => (
                                        <div key={cand.id} className="flex justify-between items-center bg-zinc-900 p-2 rounded-lg">
                                            <span className="text-xs">{cand.name}</span>
                                            <button onClick={() => setFriends([...friends, cand])} className="bg-[#1DB954] text-black px-2 py-1 text-xs rounded">Add</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add Song Modal */}
                    {addModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-black/80" onClick={() => setAddModalOpen(false)} />
                            <div className="relative w-full max-w-md bg-[#181818] border border-zinc-800 rounded-2xl p-6 z-10">
                                <div className="flex justify-between pb-4 mb-4 border-b border-zinc-800">
                                    <h3 className="text-lg font-bold">Post Song</h3>
                                    <button onClick={() => setAddModalOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={handleAddSong} className="space-y-4">
                                    <input type="text" placeholder="Song Title" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white" required />
                                    <input type="text" placeholder="Artist Name" value={newArtist} onChange={(e) => setNewArtist(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white" required />
                                    <input type="url" placeholder="Cover Image URL" value={newCover} onChange={(e) => setNewCover(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white" />
                                    <div>
                                        <label className="text-xs text-zinc-400">Rating</label>
                                        {renderGuitars(newRating, true, (r) => setNewRating(r))}
                                    </div>
                                    <button type="submit" className="w-full bg-[#1DB954] text-black font-bold py-3 rounded-lg mt-2">Publish</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
